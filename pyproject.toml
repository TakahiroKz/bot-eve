[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-eve"
version = "0.1.0"
description = "Bot de trading automático (Binance spot / MetaTrader 5)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "uvicorn>=0.27",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",  # solo existe para Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # el formateador gestiona la longitud; las cadenas HTML/SVG son largas
