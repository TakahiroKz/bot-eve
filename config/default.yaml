# Configuración por defecto. Se puede sobrescribir con otro YAML (--config).
data:
  dir: data_store            # raíz del almacenamiento (ignorada por git)
  symbols: [BTCUSDT, ETHUSDT, BNBUSDT]
  start: "2020-01"           # primer mes a descargar (YYYY-MM)
  base_interval: 1m
  resample: [5m, 15m, 1h, 4h]
  download_workers: 4
  base_url: https://data.binance.vision

backtest:
  fee_rate: 0.001            # 0.1% por lado (0.00075 pagando con BNB)
  slippage: 0.0005           # 0.05% adverso por lado
  initial_cash: 1000
  size_fraction: 1.0         # fracción del capital por operación
  holdout_start: "2025-07-01"  # desde aquí los datos se reservan (evaluación final única)
  reports_dir: reports

# Estrategias. `enabled` decide si entran al bot en vivo; `stage` es la etapa máxima
# autorizada (backtest < demo < live). Todas empiezan en backtest: ninguna pasa a demo
# hasta superar la validación walk-forward (ver docs/STRATEGIES.md).
strategies:
  sma_cross:            # línea base. Pasó walk-forward 4h y el holdout por poco (BTC negativo);
    enabled: false      # no se despliega hasta diseñar el reparto de capital entre estrategias
    stage: backtest
    intervals: [4h]
    params: {fast: 10, slow: 100}
  rsi_trend:            # núcleo
    enabled: true
    stage: backtest
    capital_fraction: 0.0
    intervals: [15m, 1h]
  atr_breakout:         # núcleo. Aprobó walk-forward 4h (docs/RESULTS_1H4H.md) y el holdout
    enabled: true
    stage: demo         # solo Binance Testnet; 'live' exige una decisión y validación aparte
    capital_fraction: 0.75   # repartido entre los 3 pares (0.25 cada uno): lo que asume el backtest
    intervals: [4h]
    params: {entry_len: 40, exit_len: 20, stop_atr: 2.0}   # fijos: no se re-optimizan en vivo
  bollinger_reversion:  # candidata de tecnicasdetrading.com: solo backtest por ahora
    enabled: false
    stage: backtest
    intervals: [5m, 15m]
  ema_adx:              # candidata de tecnicasdetrading.com: solo backtest por ahora
    enabled: false
    stage: backtest
    intervals: [15m, 1h]

execution:
  broker: binance
  mode: demo                 # demo = Binance Testnet. 'live' exige i_understand_real_money
  quote_asset: USDT
  data_from_production: true # señales con velas del mercado real (API pública)
  state_dir: state
  candles_lookback: 600
  poll_seconds: 20
  candle_delay_seconds: 3
  i_understand_real_money: false

risk:
  risk_per_trade: 0.01       # 1% del capital en riesgo hasta el stop
  default_stop_pct: 0.03     # stop de emergencia si la estrategia no define uno
  stop_limit_buffer: 0.003
  max_daily_loss: 0.03       # 3% diario: al alcanzarlo no se abren más operaciones
  max_consecutive_errors: 5
  max_data_age_candles: 3

notify:
  telegram:
    enabled: false            # true tras crear el bot y poner TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID en .env
    daily_summary_hour: 13    # resumen diario (hora del broker)

dashboard:                    # python -m bot_eve.dashboard  ->  http://127.0.0.1:8765
  host: 127.0.0.1             # solo accesible desde este PC
  port: 8765
  bots:
    - {name: "Binance demo", state_dir: state}
    - {name: "MT5 demo", state_dir: state/mt5}

logging:
  level: INFO
  file: logs/bot_eve.log
