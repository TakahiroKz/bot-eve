# Configuración para investigar con datos y costos de MetaTrader 5 / Libertex (CFD de cripto).
# Uso:  python -m bot_eve.data --config config/mt5.yaml mt5-sync
#       python -m bot_eve.backtest --config config/mt5.yaml compare --intervals 1h 4h --risk-sizing
#
# Los costos de symbol_costs salen de `python -m bot_eve.data mt5-info` (instantánea del spread).
data:
  dir: data_store/mt5
  symbols: [BTCUSD, ETHUSD]
  start: "2020-01"

backtest:
  entry_fee_rate: 0.0        # comisión 0.1% solo en la salida (según la especificación)
  exit_fee_rate: 0.001
  fee_rate: 0.001
  slippage: 0.0002           # PROVISIONAL
  # Spread = mediano histórico de `mt5-sync` (4h); swap = `mt5-info`.
  symbol_costs:
    BTCUSD: {spread_pct: 0.000354, swap_pct_per_day: 0.000442}
    ETHUSD: {spread_pct: 0.002275, swap_pct_per_day: 0.000424}
  initial_cash: 50000        # saldo de la cuenta demo; con poco capital el lote mínimo rechaza entradas
  holdout_start: "2025-07-01"
  reports_dir: reports/mt5

strategies: {}               # las estrategias no se despliegan en MT5 hasta validar con estos datos

logging:
  file: null
